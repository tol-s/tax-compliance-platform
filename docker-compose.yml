# Local development stack. Production deployment notes: docs/DEPLOYMENT.md.
name: tax-compliance-platform

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:?Set APP_KEY (php artisan key:generate --show)}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: http://localhost:8080
  FRONTEND_URL: http://localhost:3000
  DEMO_MODE: ${DEMO_MODE:-false}
  LOG_STACK: json
  LOG_JSON_STREAM: php://stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: tax_platform
  DB_USERNAME: tax_platform
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  FILESYSTEM_DISK: local
  DOCUMENTS_DISK: s3
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-secret}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: tax-documents
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tax_platform
      POSTGRES_USER: tax_platform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_platform -d tax_platform"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
    volumes: [minio-data:/data]
    ports: ["9001:9001"]

  api:
    build: { context: ., dockerfile: docker/api/Dockerfile, target: app }
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api-nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/var/www/api/public:ro
    ports: ["8080:8080"]
    depends_on: [api]

  worker:
    build: { context: ., dockerfile: docker/api/Dockerfile, target: app }
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10,60,300", "--max-time=3600"]
    environment: *api-env
    depends_on: [api]

  scheduler:
    build: { context: ., dockerfile: docker/api/Dockerfile, target: app }
    command: ["php", "artisan", "schedule:work"]
    environment: *api-env
    depends_on: [api]

  migrate:
    build: { context: ., dockerfile: docker/api/Dockerfile, target: app }
    command: ["sh", "-c", "php artisan migrate --force && php artisan rbac:sync"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., dockerfile: docker/web/Dockerfile }
    environment:
      API_URL: http://api-nginx:8080
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (openssl rand -base64 48)}
    ports: ["3000:3000"]
    depends_on: [api-nginx]

volumes:
  postgres-data:
  redis-data:
  minio-data:
