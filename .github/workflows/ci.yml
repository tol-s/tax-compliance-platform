name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: tax_platform_test, POSTGRES_USER: tax_platform, POSTGRES_PASSWORD: secret }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tax_platform" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: "pdo_pgsql, redis, intl, bcmath, zip", coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint
      # Larastan could not be installed in the environment where this was written, so no
      # baseline exists yet. Non-blocking until the first run produces one (docs/TESTING.md).
      - run: composer analyse
        continue-on-error: true
      - run: php artisan migrate --force && php artisan migrate:rollback --force && php artisan migrate --force
        env: { DB_DATABASE: tax_platform_test }
      - run: composer test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm test
      - run: pnpm build
        env: { API_URL: "http://localhost:8000", SESSION_SECRET: "ci-only-secret-ci-only-secret-ci-only-secret" }
